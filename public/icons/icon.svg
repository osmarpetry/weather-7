    <circle cx="198" cy="142" r="6" fill="#f6fbff" fill-opacity="0.82"/>
    <circle cx="224" cy="170" r="5" fill="#f6fbff" fill-opacity="0.74"/>
  </g>

  <g opacity="0.84">
    <rect x="160" y="402" width="192" height="10" rx="5" fill="#dbeeff" fill-opacity="0.55"/>
    <rect x="192" y="422" width="128" height="8" rx="4" fill="#dbeeff" fill-opacity="0.36"/>
