<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Weather 7 app icon</title>
  <desc id="desc">A cinematic weather observatory icon with a glowing horizon, cloud layer, and forecast signal.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08101e"/>
      <stop offset="0.48" stop-color="#143a62"/>
      <stop offset="1" stop-color="#6a341f"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientTransform="translate(388 96) rotate(137.87) scale(162.024)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8dd8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8dd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0" cy="0" r="1" gradientTransform="translate(154 384) rotate(90) scale(150 188)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc98c" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#ffc98c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="141" y1="320" x2="371" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67c9ff"/>
      <stop offset="0.55" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#ffc98c"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="388" cy="96" r="162" fill="url(#glowTop)"/>
  <ellipse cx="154" cy="384" rx="188" ry="150" fill="url(#glowBottom)"/>

  <g opacity="0.92">
    <rect x="96" y="104" width="320" height="304" rx="64" fill="#0a1428" fill-opacity="0.28" stroke="#d8ebff" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="112" y="120" width="288" height="272" rx="52" fill="#0f1d38" fill-opacity="0.42"/>
  </g>

  <g filter="url(#softBlur)" opacity="0.8">
    <path d="M146 322C175 282 230 257 289 257C342 257 388 277 408 308C376 286 339 275 291 275C233 275 185 291 146 322Z" fill="#8dd8ff"/>
  </g>

  <g>
    <path d="M168 320C184 285 220 262 260 262C292 262 320 277 337 302C341 301 346 300 351 300C373 300 391 317 391 339C391 361 373 378 351 378H193C168 378 148 357 148 332C148 309 164 289 186 285C194 273 205 264 219 257" fill="#edf7ff" fill-opacity="0.94"/>
    <path d="M176 332H336" stroke="url(#horizon)" stroke-width="14" stroke-linecap="round"/>
    <path d="M194 352C213 332 238 321 269 321C293 321 314 327 332 339" fill="none" stroke="#8dd8ff" stroke-opacity="0.92" stroke-width="10" stroke-linecap="round"/>
    <circle cx="332" cy="200" r="34" fill="#ffc98c"/>
    <circle cx="332" cy="200" r="60" fill="#ffc98c" fill-opacity="0.22"/>
